sprints:
  - id: SPRINT-01
    goal: "Pilot the deterministic AGY cycle runner"
    tasks:
      - AGY-001

tasks:
  - id: AGY-001
    title: "Pilot the deterministic AGY cycle runner"
    status: READY
    sprint: SPRINT-01
    ordinality: 1
    cardinality: 1
    priority: 100
    depends_on: []
    scope:
      max_files: 20
      allowed_paths:
        - .agy/**
        - plan/**
        - scripts/agy_cycle.py
        - scripts/agy-cycle
        - tests/test_agy_cycle.py
    acceptance:
      - "A task can be claimed exactly once by concurrent instances"
      - "The next action is derived from flow.yaml, never from an AI response"
      - "A cycle cannot open more than one PR"
      - "A human can reset a stuck cycle with one command"
    validation:
      - "python3 -m pytest -q tests/test_agy_cycle.py"
      - "git diff --check"
